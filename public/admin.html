<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Pedágio Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; min-height: 100vh; padding: 24px; display: flex; justify-content: center; align-items: center; }
        .login-wrapper { width: 100%; max-width: 360px; background-color: #161616; border: 1px solid #222; border-radius: 16px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .login-wrapper h2 { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 24px; }
        .login-wrapper h2 span { color: #ccff00; }
        .login-group { margin-bottom: 20px; }
        .login-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: 600; }
        .login-group input { width: 100%; background-color: #0d0d0d; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 15px; }
        .login-group input:focus { border-color: #ccff00; outline: none; }
        .btn-login { width: 100%; background-color: #ccff00; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .btn-login:hover { opacity: 0.9; }
        .login-error { color: #ff3b30; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
        .admin-container { width: 100%; max-width: 1200px; margin: 0 auto; display: none; flex-direction: column; align-self: flex-start; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid #222; padding-bottom: 16px; width: 100%; }
        header h1 { font-size: 24px; font-weight: 800; }
        header h1 span { color: #ccff00; }
        .btn-logout { background: none; border: 1px solid #333; color: #888; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-logout:hover { color: #fff; border-color: #555; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; width: 100%; }
        .metric-card { background-color: #161616; border: 1px solid #222; border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 16px; }
        .metric-icon { width: 48px; height: 48px; border-radius: 8px; background-color: rgba(204, 255, 0, 0.1); color: #ccff00; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .metric-icon.blue { background-color: rgba(0, 132, 255, 0.1); color: #0084ff; }
        .metric-icon.green { background-color: rgba(52, 199, 89, 0.1); color: #34c759; }
        .metric-info p { font-size: 13px; color: #888; margin-bottom: 4px; }
        .metric-info h3 { font-size: 22px; font-weight: 700; }
        .main-grid { display: grid; grid-template-columns: 320px 1fr; gap: 32px; width: 100%; }
        @media(max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        .config-card { background-color: #161616; border: 1px solid #222; border-radius: 12px; padding: 24px; height: fit-content; }
        .config-card h2 { font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: 600; }
        .form-group .input-wrapper { position: relative; display: flex; align-items: center; }
        .form-group .input-wrapper span { position: absolute; left: 12px; color: #666; font-size: 14px; font-weight: 600; }
        .form-group input { width: 100%; background-color: #0d0d0d; border: 1px solid #333; border-radius: 6px; padding: 10px 10px 10px 40px; color: #fff; font-size: 15px; font-weight: 700; }
        .btn-save { width: 100%; background-color: #ccff00; color: #000; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; margin-top: 8px; }
        .btn-save:hover { opacity: 0.9; }
        .data-card { background-color: #161616; border: 1px solid #222; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; }
        .tabs-wrapper { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; margin-bottom: 20px; padding-bottom: 10px; flex-wrap: wrap; gap: 12px; }
        .tabs { display: flex; gap: 8px; }
        .tab-btn { background: none; border: none; color: #888; font-size: 14px; font-weight: 700; padding: 8px 16px; cursor: pointer; border-radius: 6px; }
        .tab-btn.active { background-color: #222; color: #fff; }
        .tab-btn span { font-size: 11px; padding: 2px 6px; background-color: #333; border-radius: 10px; margin-left: 6px; color: #aaa; }
        .tab-btn.active span { background-color: #ccff00; color: #000; }
        .search-box { position: relative; }
        .search-box input { background-color: #0d0d0d; border: 1px solid #333; border-radius: 6px; padding: 8px 12px 8px 36px; color: #fff; font-size: 13px; width: 220px; }
        .search-box i { position: absolute; left: 12px; top: 11px; color: #666; font-size: 13px; }
        .table-container { overflow-x: auto; min-height: 200px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { color: #666; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid #222; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        td { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; color: #ccc; }
        tr:hover td { background-color: #1c1c1c; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge.pendente { background-color: rgba(255, 149, 0, 0.15); color: #ff9500; }
        .badge.pago { background-color: rgba(52, 199, 89, 0.15); color: #34c759; }
        .empty-msg { text-align: center; color: #555; padding: 40px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-wrapper">
        <h2>Painel <span>Admin</span></h2>
        <div class="login-group">
            <label>USUÁRIO</label>
            <input type="text" id="login-user" placeholder="Digite seu usuário">
        </div>
        <div class="login-group">
            <label>SENHA DO SISTEMA</label>
            <input type="password" id="login-pass" placeholder="••••••••">
        </div>
        <button id="btn-do-login" class="btn-login">Acessar Painel</button>
        <div id="login-error-msg" class="login-error">Usuário ou senha incorretos!</div>
    </div>

    <div id="main-panel" class="admin-container">
        <header>
            <h1>Painel <span>Admin</span></h1>
            <div style="display: flex; align-items: center; gap: 16px;">
                <div style="font-size: 13px; color: #888;"><i class="fa-solid fa-circle" style="color: #34c759; font-size: 10px; margin-right: 6px;"></i> Monitoramento Realtime</div>
                <button id="btn-logout" class="btn-logout">Sair</button>
            </div>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-icon"><i class="fa-solid fa-eye"></i></div>
                <div class="metric-info">
                    <p>Acessos à Tela</p>
                    <h3 id="m-views">0</h3>
                </div>
            </div>
            <div class="metric-card">
                <div class="metric-icon blue"><i class="fa-solid fa-arrow-pointer"></i></div>
                <div class="metric-info">
                    <p>Cliques no Pix</p>
                    <h3 id="m-clicks">0</h3>
                </div>
            </div>
            <div class="metric-card">
                <div class="metric-icon green"><i class="fa-solid fa-cash-register"></i></div>
                <div class="metric-info">
                    <p>Faturamento Aprovado</p>
                    <h3 id="m-revenue">R$ 0,00</h3>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <div class="config-card">
                <h2><i class="fa-solid fa-sliders" style="color: #ccff00;"></i> Taxas do Sistema</h2>
                <div class="form-group">
                    <label>TARIFA BASE FREE FLOW</label>
                    <div class="input-wrapper">
                        <span>R$</span>
                        <input type="number" id="tax-base" step="0.01" value="14.50">
                    </div>
                </div>
                <div class="form-group">
                    <label>MULTA ADMINISTRATIVA</label>
                    <div class="input-wrapper">
                        <span>R$</span>
                        <input type="number" id="tax-fine" step="0.01" value="15.00">
                    </div>
                </div>
                <div class="form-group">
                    <label>JUROS DE MORA</label>
                    <div class="input-wrapper">
                        <span>R$</span>
                        <input type="number" id="tax-interest" step="0.01" value="4.40">
                    </div>
                </div>
                <button id="btn-save-rates" class="btn-save">Salvar Alterações</button>
            </div>

            <div class="data-card">
                <div class="tabs-wrapper">
                    <div class="tabs">
                        <button class="tab-btn active" id="tab-pendentes-btn">Pendentes <span id="count-pendentes">0</span></button>
                        <button class="tab-btn" id="tab-pagos-btn">Pagos <span id="count-pagos">0</span></button>
                    </div>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="admin-search" placeholder="Buscar Placa ou CPF...">
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Placa / CPF</th>
                                <th>Tipo</th>
                                <th>Valor Gerado</th>
                                <th>Data de Consulta</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                    <div id="empty-state" class="empty-msg" style="display: none;">Nenhum registro encontrado nesta aba.</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const responseConfig = await fetch('/api/config');
        const appConfig = await responseConfig.json();

        const app = initializeApp(appConfig.firebase);
        const db = getDatabase(app);

        const ADMIN_USER = appConfig.admin.user;
        const ADMIN_PASS = appConfig.admin.pass;

        let listaVeiculos = [];
        let currentTab = "pendente";

        const loginScreen = document.getElementById('login-screen');
        const mainPanel = document.getElementById('main-panel');
        const errorMsg = document.getElementById('login-error-msg');

        document.getElementById('btn-do-login').addEventListener('click', () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value;

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                loginScreen.style.display = "none";
                document.body.style.alignItems = "flex-start";
                mainPanel.style.display = "flex";
                inicializarMonitoramentoRealtime();
            } else {
                errorMsg.style.display = "block";
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            window.location.reload();
        });

        function inicializarMonitoramentoRealtime() {
            onValue(ref(db), (snapshot) => {
                const data = snapshot.val() || {};
                
                // Métrica de Acessos
                const stats = data.stats || {};
                const metricas = data.metricas || {};
                const viewsCount = stats.acessos || stats.acessos_tela || metricas.acessos || metricas.views || 0;
                const clicksCount = stats.cliques_pix || stats.cliques || metricas.cliques_pix || metricas.clicks || 0;
                
                document.getElementById('m-views').textContent = viewsCount;
                document.getElementById('m-clicks').textContent = clicksCount;

                // Taxas
                const t = (data.configuracoes && data.configuracoes.taxas) || data.taxas || {};
                if (t.base !== undefined || t.tarifa_base !== undefined) {
                    document.getElementById('tax-base').value = parseFloat(t.base || t.tarifa_base || 14.50).toFixed(2);
                    document.getElementById('tax-fine').value = parseFloat(t.fine || t.multa_adm || 15.00).toFixed(2);
                    document.getElementById('tax-interest').value = parseFloat(t.interest || t.juros_mora || 4.40).toFixed(2);
                }

                // Veículos
                const veiculosObj = data.veiculos || {};
                listaVeiculos = Object.keys(veiculosObj).map(key => {
                    const item = veiculosObj[key] || {};
                    return {
                        id: key.toUpperCase(),
                        placa: (item.placa || key).toUpperCase(),
                        status: String(item.status || 'pendente').toLowerCase(),
                        valor: parseFloat(item.valor || 33.90),
                        tipo_busca: item.tipo_busca || (key.length === 11 ? 'cpf' : 'placa'),
                        data_consulta: item.data_consulta || item.criado_em || item.data || new Date().toISOString()
                    };
                }).sort((a, b) => new Date(b.data_consulta || 0) - new Date(a.data_consulta || 0));

                atualizarContadoresEFaturamento();
                renderTable();
            });
        }

        document.getElementById('btn-save-rates').addEventListener('click', async () => {
            const base = parseFloat(document.getElementById('tax-base').value) || 0;
            const fine = parseFloat(document.getElementById('tax-fine').value) || 0;
            const interest = parseFloat(document.getElementById('tax-interest').value) || 0;

            const payload = {
                base, fine, interest,
                tarifa_base: base, multa_adm: fine, juros_mora: interest
            };

            try {
                await set(ref(db, 'configuracoes/taxas'), payload);
                await set(ref(db, 'taxas'), payload);
                alert("Taxas atualizadas com sucesso!");
            } catch (err) {
                alert("Erro ao salvar taxas: " + err.message);
            }
        });

        function atualizarContadoresEFaturamento() {
            let pends = 0; let pags = 0; let faturamento = 0;
            
            listaVeiculos.forEach(v => {
                if (v.status === "pago" || v.status === "approved" || v.status === "completed") {
                    pags++;
                    faturamento += parseFloat(v.valor || 0);
                } else {
                    pends++;
                }
            });
            
            document.getElementById('count-pendentes').textContent = pends;
            document.getElementById('count-pagos').textContent = pags;
            document.getElementById('m-revenue').textContent = faturamento.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        const tabPendentesBtn = document.getElementById('tab-pendentes-btn');
        const tabPagosBtn = document.getElementById('tab-pagos-btn');

        tabPendentesBtn.addEventListener('click', () => {
            currentTab = "pendente";
            tabPendentesBtn.classList.add('active');
            tabPagosBtn.classList.remove('active');
            renderTable();
        });

        tabPagosBtn.addEventListener('click', () => {
            currentTab = "pago";
            tabPagosBtn.classList.add('active');
            tabPendentesBtn.classList.remove('active');
            renderTable();
        });

        document.getElementById('admin-search').addEventListener('input', () => {
            renderTable();
        });

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const searchVal = document.getElementById('admin-search').value.toUpperCase().trim();
            tbody.innerHTML = "";

            const filtrados = listaVeiculos.filter(v => {
                const statusNormalizado = (v.status === "pago" || v.status === "approved" || v.status === "completed") ? "pago" : "pendente";
                const bateAba = statusNormalizado === currentTab;
                const bateBusca = v.id.includes(searchVal) || v.placa.includes(searchVal);
                return bateAba && bateBusca;
            });

            if (filtrados.length === 0) {
                document.getElementById('empty-state').style.display = "block";
                return;
            }
            document.getElementById('empty-state').style.display = "none";

            filtrados.forEach(v => {
                const tr = document.createElement('tr');
                
                let dataFormatada = '---';
                if (v.data_consulta) {
                    const d = new Date(v.data_consulta);
                    dataFormatada = isNaN(d.getTime()) ? v.data_consulta : d.toLocaleString('pt-BR');
                }

                const valorFormatado = parseFloat(v.valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const tipoBusca = v.tipo_busca ? v.tipo_busca.toUpperCase() : 'PLACA';
                const statusBadge = (v.status === "pago" || v.status === "approved" || v.status === "completed") ? "pago" : "pendente";

                tr.innerHTML = `
                    <td style="font-weight: 700; color: #fff; letter-spacing: 0.5px;">${v.placa || v.id}</td>
                    <td><span style="font-size: 11px; background:#222; padding:3px 6px; border-radius:4px;">${tipoBusca}</span></td>
                    <td style="font-weight: 600;">${valorFormatado}</td>
                    <td style="color:#777;">${dataFormatada}</td>
                    <td><span class="badge ${statusBadge}">${statusBadge}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
